<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Prajwal Mane - CSE Student, Full Stack Developer and AI/ML Enthusiast">

    <title>Prajwal Mane | Linktree</title>

    <link rel="stylesheet" href="new1.css">
</head>

<body>

    <!-- Background decoration -->
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <!-- Main Card -->
    <main class="box">

        <!-- Theme Button -->
        <button id="themeBtn" class="theme-btn">
            ☀️
        </button>


        <!-- Profile Section -->
        <div class="profile">

            <div class="profile-ring">

                <img src="prajwal.jpeg" alt="Prajwal Mane">

            </div>

            <h1>
                Prajwal Mane
                <span class="verified">✓</span>
            </h1>

            <p class="username">
                @prajwal_mane
            </p>

            <p class="bio">
                B.Tech Computer Science | Full Stack Developer
                <br>
                Git & GitHub | AI/ML & GenAI Enthusiast | Java & DSA
            </p>

            <div class="status">

                <span class="status-dot"></span>

                Open to learning & opportunities

            </div>

        </div>


        <!-- Social Links -->
        <section class="links">


            <!-- LinkedIn -->
            <a class="link-card"
                href="https://www.linkedin.com/in/prajwal-mane-6413343a0/"
                target="_blank">

                <img src="icons8-linkedin-48.png" alt="LinkedIn">

                <span>
                    LinkedIn
                </span>

                <b>↗</b>

            </a>


            <!-- GitHub -->
            <a class="link-card"
                href="https://github.com/maneprajwal006-alt/"
                target="_blank">

                <img src="icons8-github-64.png" alt="GitHub">

                <span>
                    GitHub
                </span>

                <b>↗</b>

            </a>


            <!-- Instagram -->
            <a class="link-card"
                href="https://www.instagram.com/prajwal_mane_100?igsi=dzFzZDZ0andheHZq"
                target="_blank">

                <img src="icons8-instagram-logo-94.png" alt="Instagram">

                <span>
                    Instagram
                </span>

                <b>↗</b>

            </a>


            <!-- Resume -->
            <a class="link-card"
                href="#"
                id="resumeLink">

                <img src="icons8-resume-48.png" alt="Resume">

                <span>
                    My Resume
                </span>

                <b>↓</b>

            </a>


            <a class="link-card"
                href="https://wa.me/7019037127/"
                target="_blank">

                <img src="icons8-whatsapp-logo-94.png" alt="WhatsApp">

                <span>
                    WhatsApp
                </span>

                <b>↗</b>

            </a>






            <!-- Email -->
            <button class="link-card email-button"
                id="emailBtn">

                <span class="emoji-icon">
                    ✉️
                </span>

                <span>
                    Email Me
                </span>

                <b>
                    ⧉
                </b>

            </button>


           

        </section>


        <!-- Footer -->
        <footer>

            <p>
                "Build. Learn. Repeat. 🚀"
            </p>

            <small>
                © <span id="year"></span> Prajwal Mane
            </small>

        </footer>

    </main>


    <!-- Toast notification -->
    <div id="toast" class="toast">
        Email copied!
    </div>


    <!-- JavaScript -->
    <script src="new3.js"></script>

</body>

</html>
